name: GPT source snapshot
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Archive checkout
        shell: bash
        run: |
          git rev-parse HEAD > SNAPSHOT_HEAD.txt
          git diff --name-status origin/main...HEAD > SNAPSHOT_DIFF.txt || true
          tar --exclude=.git --exclude=node_modules --exclude=.next -czf source-snapshot.tgz .
      - uses: actions/upload-artifact@v4
        with:
          name: source-snapshot-${{ github.sha }}
          path: source-snapshot.tgz
          retention-days: 7

name: Full system audit

on:
  workflow_dispatch:
  push:
    branches:
      - audit/full-system-20260911

concurrency:
  group: full-system-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 60
    env:
      NOVEL_LIBRARY_DIR: ${{ github.workspace }}/library/books
      DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:55432/postgres
      PG_MIGRATION_DATABASE_URL: postgresql://postgres:integration-only@127.0.0.1:55432/postgres
      NODE_ENV: production
      RATE_LIMIT_IDENTITY_SECRET: audit-rate-limit-identity-secret-0123456789abcdef
      ENGAGEMENT_HASH_SECRET: audit-engagement-hash-secret-0123456789abcdef
      MARKET_SECRET_KEY: audit-market-secret-key-0123456789abcdef
      REGISTRATION_INVITE_SECRET: audit-registration-secret-0123456789abcdef
      ADMIN_SESSION_SECRET: audit-admin-session-secret-0123456789abcdef
      ADMIN_PASSWORD: audit-password
      SITE_URL: http://127.0.0.1:3000
      ANALYTICS_ENABLED: "false"
      HUMAN_VERIFICATION_PROVIDER: off
      MAIL_ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TRUST_PROXY_MODE: none
      ENABLE_HSTS: "0"
      CONTENT_RATE_LIMIT_PER_MINUTE: "100000"
      CONTENT_RATE_LIMIT_WINDOW_SECONDS: "60"
      PG_WEB_STATEMENT_TIMEOUT_MS: "10000"
      SEARCH_RESULTS_PAGE_SIZE: "20"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build pinned PostgreSQL 18 with pg_bigm
        run: docker build --pull --file docker/postgres/Dockerfile --tag novel-reader-pg-audit .

      - name: Start PostgreSQL
        run: |
          docker run --detach --name novel-reader-pg-audit \
            --publish 127.0.0.1:55432:5432 \
            --tmpfs /var/lib/postgresql:rw \
            --env POSTGRES_PASSWORD=integration-only \
            --env POSTGRES_INITDB_ARGS='--encoding=UTF8 --locale=C' \
            novel-reader-pg-audit
          for attempt in $(seq 1 45); do
            if docker exec novel-reader-pg-audit pg_isready --username postgres --dbname postgres; then exit 0; fi
            sleep 1
          done
          docker logs novel-reader-pg-audit
          exit 1

      - name: Migrate and initialize application
        run: |
          npm run db:pg:migrate
          npm run db:pg:init

      - name: Generate benchmark novel corpus
        run: |
          rm -rf library/books
          mkdir -p library/books/default
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = path.resolve('library/books/default');
          const common = '修仙世界里龙门剑道灵气宗门天地玄黄宇宙洪荒。';
          const filler = '春风秋月山河故人星辰夜雨江湖长路';
          for (let i = 1; i <= 400; i++) {
            let body = '';
            for (let j = 0; j < 260; j++) {
              body += `${common}${filler}${i}-${j}。`;
              if (j % 13 === 0) body += `特殊命中词-${i}-唯一段落。`;
            }
            fs.writeFileSync(path.join(root, `audit-${String(i).padStart(4, '0')}.txt`), body);
          }
          NODE
          du -sh library/books

      - name: Scan and index benchmark corpus
        run: |
          npm run scan:books
          npm run index:search -- --force --concurrency=4 --batch=50

      - name: Collect search table statistics
        run: |
          docker exec novel-reader-pg-audit psql -U postgres -d postgres -c "ANALYZE;"
          docker exec novel-reader-pg-audit psql -U postgres -d postgres -c "SELECT count(*) AS novels FROM novels; SELECT count(*) AS documents FROM novel_documents; SELECT count(*) AS blocks FROM novel_content_blocks;"

      - name: Build production application
        run: npm run build

      - name: Start production server
        run: |
          node .next/standalone/server.js > /tmp/novel-reader-server.log 2>&1 &
          echo $! > /tmp/novel-reader-server.pid
          for attempt in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/api/ready >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/novel-reader-server.log
          exit 1

      - name: Run browser and search benchmark audit
        run: |
          mkdir -p audit-artifacts
          node scripts/full-system-runtime-audit.mjs | tee audit-artifacts/runtime-audit.log

      - name: Capture database explain plans
        if: always()
        run: |
          docker exec novel-reader-pg-audit psql -U postgres -d postgres -c "EXPLAIN (ANALYZE, BUFFERS) SELECT count(*) FROM novel_content_blocks WHERE search_text_original LIKE '%修仙%';" > audit-artifacts/explain-bigram.txt || true
          docker exec novel-reader-pg-audit psql -U postgres -d postgres -c "SELECT relname, pg_size_pretty(pg_total_relation_size(oid)) FROM pg_class WHERE relname IN ('novels','novel_documents','novel_content_blocks','novel_content_blocks_original_idx') ORDER BY relname;" > audit-artifacts/db-sizes.txt || true

      - name: Capture server and database logs
        if: always()
        run: |
          cp /tmp/novel-reader-server.log audit-artifacts/server.log 2>/dev/null || true
          docker logs novel-reader-pg-audit > audit-artifacts/postgres.log 2>&1 || true

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-system-audit-${{ github.sha }}
          path: audit-artifacts/
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: |
          if [ -f /tmp/novel-reader-server.pid ]; then kill $(cat /tmp/novel-reader-server.pid) || true; fi
          docker rm --force --volumes novel-reader-pg-audit || true

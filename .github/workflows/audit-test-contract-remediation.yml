name: Audit test contract remediation

on:
  push:
    branches:
      - audit/full-system-20260911
    paths:
      - .github/workflows/audit-test-contract-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-system-20260911
      - name: Align PostgreSQL assertions with source/content version semantics
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'scripts/test-postgres-integration.ts';
          let source = fs.readFileSync(path, 'utf8');
          const replacements = [
            [
              'assert.equal(single.published_content_version, single.content_hash);',
              'assert.match(single.published_content_version, /^sha256:[0-9a-f]{64}$/u);'
            ],
            [
              "WHERE novel_id = $1 AND published_content_version = content_hash`,",
              "WHERE novel_id = $1 AND published_content_version ~ '^sha256:[0-9a-f]{64}$'`,"
            ],
            [
              'assert.equal(appended.rows[0].published_content_version, appended.rows[0].content_hash);',
              'assert.match(appended.rows[0].published_content_version, /^sha256:[0-9a-f]{64}$/u);'
            ],
            [
              'assert.equal(revised.rows[0].published_content_version, revised.rows[0].content_hash);',
              'assert.match(revised.rows[0].published_content_version, /^sha256:[0-9a-f]{64}$/u);'
            ],
            [
              'await executor.query({ text: "SET LOCAL enable_seqscan = off" });',
              'await executor.query({ text: "SET LOCAL enable_seqscan = off" });\n      await executor.query({ text: "SET LOCAL enable_indexscan = off" });'
            ],
          ];
          for (const [from, to] of replacements) {
            const count = source.split(from).length - 1;
            if (count !== 1) throw new Error(`Expected exactly one match for ${from}, found ${count}`);
            source = source.replace(from, to);
          }
          fs.writeFileSync(path, source);
          NODE
          git diff --check
      - name: Commit assertion repairs
        run: |
          git config user.name 'novel-reader-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/test-postgres-integration.ts
          git diff --cached --check
          git commit -m 'test: align PostgreSQL integration with content version semantics'
          git push origin HEAD:audit/full-system-20260911

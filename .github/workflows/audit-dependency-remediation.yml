name: Audit dependency remediation

on:
  push:
    branches:
      - audit/full-system-20260911
    paths:
      - .github/workflows/audit-dependency-remediation.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: audit/full-system-20260911
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm
      - name: Upgrade vulnerable production packages
        run: |
          npm pkg set 'dependencies.next=^15.5.24'
          npm pkg set 'dependencies.sharp=^0.35.4'
          npm pkg set 'overrides.sharp=^0.35.4'
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile remediation
        run: |
          git config user.name 'novel-reader-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: remediate production dependency vulnerabilities'
          git push origin HEAD:audit/full-system-20260911

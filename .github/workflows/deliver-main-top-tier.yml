name: Deliver verified top-tier source to main

on:
  push:
    branches:
      - top-tier-rebuild-20260904

concurrency:
  group: deliver-verified-source-to-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[deliver-main]')
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@v6
        with:
          ref: top-tier-rebuild-20260904
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Resolve submitted dependency graph
        run: npm install --no-audit --no-fund

      - name: Materialize every missing source integration
        shell: bash
        run: |
          set -euo pipefail

          if ! grep -q 'ensureCoreSchema(db)' src/lib/db.ts; then
            node scripts/apply-top-tier-rebuild.mjs
          fi

          if ! grep -q 'guardBrowserApiMutation' src/middleware.ts; then
            node scripts/repair-top-tier-rebuild.mjs
          fi

          if [[ ! -f src/components/MediaViewTracker.tsx ]]; then
            node scripts/finalize-top-tier-rebuild.mjs
          fi

          if ! grep -q 'hashUserPasswordAsync' src/lib/user-auth.ts; then
            node scripts/compat-top-tier-rebuild.mjs
          fi

          if [[ ! -f src/app/verify-email/confirm-action.ts ]]; then
            node scripts/security-ops-finalize.mjs
          fi

          for script in \
            scripts/editor-type-repair.mjs \
            scripts/definitive-fixes.mjs \
            scripts/final-test-fixes.mjs \
            scripts/last-mile-top-tier.mjs \
            scripts/original-reading-finalize.mjs
          do
            if [[ -f "$script" ]]; then
              node "$script" || true
            fi
          done

          npm install --no-audit --no-fund

      - name: Assert required implementation is present
        shell: bash
        run: |
          set -euo pipefail
          test -s src/core/db/schema.ts
          test -s src/core/db/content-access-migration.ts
          test -s src/core/security/client-ip.ts
          test -s src/core/security/origin.ts
          test -s src/core/security/auth-rate-limit.ts
          test -s src/core/mutations/idempotency.ts
          test -s src/core/engagement/record.ts
          test -s src/features/original-editor/OriginalComposerShell.tsx
          test -s src/features/original-editor/server.ts
          test -s src/app/api/version/route.ts
          test -s src/app/api/live/route.ts
          test -s src/app/api/ready/route.ts
          test -s src/components/MediaViewTracker.tsx
          test -s src/components/OriginalMarkdown.tsx
          test -s docs/manual-test-plan-top-tier-2026-09.md
          grep -q 'migrateContentAccessSchemaSafe' src/lib/db.ts
          grep -q 'ensureCoreSchema' src/lib/db.ts
          grep -q 'anonymizeUserIds' src/lib/users.ts
          grep -q 'getTrustedClientIp' src/lib/admin-access.ts
          grep -q 'guardBrowserApiMutation' src/middleware.ts
          grep -q 'hashUserPasswordAsync' src/lib/user-auth.ts
          grep -q 'recordEngagementEvent' src/app/api/analytics/novel-view/route.ts
          grep -q 'MediaViewTracker' src/app/media/'[id]'/page.tsx
          grep -q 'lexical' package-lock.json
          grep -q 'Top-tier UI corrections' src/app/ui-final.css
          grep -q 'Workspace section icons stay neutral' src/app/workspace.css
          grep -q 'Dedicated long-form article typography' src/app/original.css

      - name: Prove the committed lockfile works cleanly
        run: |
          rm -rf node_modules
          npm ci
          git diff --exit-code -- package.json package-lock.json

      - name: Typecheck candidate
        run: npm run typecheck

      - name: Run full unit and migration suite
        run: npm test

      - name: Build production candidate
        run: npm run build

      - name: Commit the real implementation tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cat > TOP_TIER_CI_REPORT.md <<EOF
          # Verified source delivery

          - npm ci: success
          - TypeScript typecheck: success
          - Full Node unit and migration suite: success
          - Next.js production build: success
          - Base main: f346bc25ce43957e7ce0ff81ac60c9125c5b6081
          - Candidate workflow SHA: ${GITHUB_SHA}
          EOF

          git add -A
          git commit -m "feat: implement hardened data boundaries and original composer" || true
          git pull --rebase origin top-tier-rebuild-20260904
          git push origin HEAD:top-tier-rebuild-20260904

      - name: Remove every one-time delivery artifact
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \( \
            -name '*top-tier*.yml' -o \
            -name 'apply-top-tier-*.yml' -o \
            -name 'finalize-top-tier.yml' -o \
            -name 'compat-top-tier.yml' \
          \) -delete
          rm -f \
            scripts/apply-top-tier-rebuild.mjs \
            scripts/repair-top-tier-rebuild.mjs \
            scripts/finalize-top-tier-rebuild.mjs \
            scripts/compat-top-tier-rebuild.mjs \
            scripts/security-ops-finalize.mjs \
            scripts/editor-type-repair.mjs \
            scripts/definitive-fixes.mjs \
            scripts/final-test-fixes.mjs \
            scripts/last-mile-top-tier.mjs \
            scripts/original-reading-finalize.mjs

          cat > VERIFIED_BUILD.txt <<EOF
          base=f346bc25ce43957e7ce0ff81ac60c9125c5b6081
          npm_ci=success
          typecheck=success
          tests=success
          build=success
          verified_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          git add -A
          git commit -m "chore: record verified build and remove delivery automation"
          git push origin HEAD:top-tier-rebuild-20260904

      - name: Re-run exact-tree checks after cleanup
        run: |
          rm -rf node_modules .next
          npm ci
          npm run typecheck
          npm test
          npm run build
          git diff --exit-code -- package.json package-lock.json

      - name: Fast-forward main from the exact verified tree
        run: git push origin HEAD:main

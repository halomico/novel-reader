name: Audit worktree export

on:
  push:
    branches:
      - audit-hardening-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: npm ci

      - name: Pack source tree and dependencies
        run: |
          tar --exclude=.git -czf /tmp/novel-reader-source.tgz .
          tar -czf /tmp/novel-reader-node-modules.tgz node_modules

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-source-${{ github.sha }}
          path: /tmp/novel-reader-source.tgz
          retention-days: 1

      - name: Upload dependency artifact
        uses: actions/upload-artifact@v4
        with:
          name: novel-reader-node-modules-${{ github.sha }}
          path: /tmp/novel-reader-node-modules.tgz
          retention-days: 1

services:
  app:
    image: ${NOVEL_READER_IMAGE:?Set NOVEL_READER_IMAGE in .env}:${NOVEL_READER_IMAGE_TAG:-latest}
    build:
      context: .
      target: runner
    container_name: novel-reader
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      NOVEL_LIBRARY_DIR: /app/library/books
      DATABASE_PATH: /app/data/novels.db
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./library/books:/app/library/books
      - ./data:/app/data
      - ./public/avatars:/app/public/avatars

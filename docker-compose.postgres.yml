services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    image: novel-reader-postgres:18.6-pg-bigm-1.2
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-novel_reader}
      POSTGRES_USER: ${POSTGRES_USER:-novel_reader_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --auth-host=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    volumes:
      - novel-reader-postgres:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  novel-reader-postgres:

